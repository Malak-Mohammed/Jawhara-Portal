<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${grade.name} + ' - المواد الدراسية'">المواد الدراسية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#141210] text-[#FDFBF7] min-h-screen flex flex-col justify-between font-sans selection:bg-amber-400 selection:text-zinc-950">

<!-- Header / Top Navigation -->
<header class="bg-[#1C1917]/80 backdrop-blur-md border-b border-amber-500/20 shadow-md py-3 px-6 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <!-- Back to Grades Button -->
        <a th:href="@{/}" class="text-xs bg-amber-500/10 hover:bg-amber-500/20 text-amber-200 border border-amber-500/30 px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1.5 shadow-sm">
            <span>← العودة للمراحل</span>
        </a>

        <!-- Small Top Brand / Quick Title -->
        <span class="text-amber-300/90 font-medium text-xs sm:text-sm">منصة الجوهرة</span>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-5xl mx-auto px-6 py-8 flex-grow w-full">

    <!-- Grade Header Section -->
    <div class="mb-6 pb-4 border-b border-amber-500/20">
        <span class="text-amber-400 font-semibold tracking-wide text-xs md:text-sm uppercase bg-amber-500/10 px-2.5 py-1 rounded-md border border-amber-500/20">المرحلة الدراسية</span>
        <h2 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-500 mt-2" th:text="${grade.name}">اسم الصف</h2>
    </div>

    <!-- Section Title -->
    <div class="mb-4">
        <h3 class="text-lg md:text-xl font-bold text-amber-300 border-r-4 border-amber-400 pr-3">
            المواد الدراسية المتاحة
        </h3>
    </div>

    <!-- Subjects Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <a th:each="subject : ${subjects}"
           th:href="@{/subjects/{id}(id=${subject.id})}"
           class="bg-[#1C1917]/90 backdrop-blur-sm p-5 rounded-xl shadow-md border border-amber-500/20 hover:border-amber-400 hover:shadow-amber-500/10 hover:shadow-lg transition-all duration-300 group text-center flex flex-col items-center justify-center relative overflow-hidden">
            <!-- Subtle Gold Glow on Hover -->
            <div class="absolute inset-0 bg-gradient-to-b from-amber-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>

            <span class="text-3xl mb-2 group-hover:scale-110 transition-transform">📖</span>
            <h4 class="text-base font-bold text-[#FDFBF7] group-hover:text-amber-300 transition" th:text="${subject.name}">اسم المادة</h4>
        </a>
    </div>
</main>

<!-- Footer -->
<footer class="bg-[#1C1917] border-t border-amber-500/20 py-3 text-center text-[#F5EBE6]/50 text-xs">
    &copy; 2026 منصة الجوهرة للمراجع المدرسية. لا يتطلب تسجيل دخول للطلبة.
</footer>

</body>
</html>
