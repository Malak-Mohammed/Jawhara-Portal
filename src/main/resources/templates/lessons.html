<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject.name} + ' - Lessons'">Lessons</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans">

<header class="bg-indigo-600 text-white shadow-md py-6 px-8">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-wide">📚 School Reference Portal</h1>
        <a th:href="@{/grades/{id}(id=${subject.grade.id})}" class="text-sm bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg transition font-medium">← Back to Subjects</a>
    </div>
</header>

<main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
    <div class="mb-8">
        <span class="text-indigo-600 font-semibold tracking-wide uppercase text-sm" th:text="${subject.grade.name}">Grade</span>
        <h2 class="text-3xl font-extrabold text-slate-800" th:text="${subject.name}">Subject Name</h2>
    </div>

    <div class="space-y-4">
        <a th:each="lesson, iterStat : ${lessons}"
           th:href="@{/lessons/{id}/materials(id=${lesson.id})}"
           class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:border-indigo-500 hover:shadow-md transition flex items-center justify-between group">
            <div class="flex items-center space-x-4">
                <span class="bg-slate-100 text-slate-600 font-bold px-3 py-2 rounded-lg text-sm" th:text="${iterStat.count}">1</span>
                <h3 class="text-lg font-bold text-slate-700 group-hover:text-indigo-600 transition" th:text="${lesson.title}">Lesson Title</h3>
            </div>
            <span class="text-indigo-600 font-medium text-sm">View Materials →</span>
        </a>
    </div>
</main>

<footer class="bg-white border-t border-slate-200 py-4 text-center text-slate-400 text-sm">
    &copy; 2026 School Reference Portal
</footer>

</body>
</html>
