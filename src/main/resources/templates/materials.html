<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${lesson.title} + ' - المراجع'">المراجع</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#141210] text-[#FDFBF7] min-h-screen flex flex-col justify-between font-sans selection:bg-amber-400 selection:text-zinc-950">

<!-- Header / Top Navigation -->
<header class="bg-[#1C1917]/80 backdrop-blur-md border-b border-amber-500/20 shadow-md py-3 px-6 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <!-- Back to Lessons Button -->
        <a th:href="@{/subjects/{id}(id=${lesson.subject.id})}" class="text-xs bg-amber-500/10 hover:bg-amber-500/20 text-amber-200 border border-amber-500/30 px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1.5 shadow-sm">
            <span>← العودة للدروس</span>
        </a>

        <!-- Admin Quick Action Bar -->
        <div class="flex items-center gap-2">
            <span class="text-amber-300/90 font-medium text-xs sm:text-sm">منصة الجوهرة</span>
            <a th:href="@{/admin/dashboard}" class="bg-amber-500 text-zinc-950 font-bold text-xs px-3 py-1.5 rounded-lg hover:bg-amber-400 transition">
                لوحة التحكم الإدارية ⚙
            </a>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-5xl mx-auto px-6 py-8 flex-grow w-full">

    <!-- Lesson Header Section -->
    <div class="mb-6 pb-4 border-b border-amber-500/20 flex justify-between items-end">
        <div>
            <span class="text-amber-400 font-semibold tracking-wide text-xs md:text-sm uppercase bg-amber-500/10 px-2.5 py-1 rounded-md border border-amber-500/20" th:text="${lesson.subject.name}">المادة</span>
            <h2 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-500 mt-2" th:text="${lesson.title}">عنوان الدرس</h2>
        </div>
    </div>

    <!-- Materials Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div th:each="material : ${materials}" class="bg-[#1C1917]/90 backdrop-blur-sm p-5 rounded-xl shadow-md border border-amber-500/20 hover:border-amber-400 transition flex flex-col justify-between relative overflow-hidden group">
            <div class="absolute inset-0 bg-gradient-to-b from-amber-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>

            <div class="relative z-10">
                <div class="flex items-center justify-between mb-2">
                    <span class="px-2.5 py-0.5 bg-amber-500/10 text-amber-300 border border-amber-500/30 font-semibold text-xs rounded-md uppercase" th:text="${material.fileType}">PDF</span>
                </div>
                <h3 class="text-base font-bold text-[#FDFBF7] group-hover:text-amber-300 transition mb-2" th:text="${material.title}">عنوان المرجع</h3>
            </div>

            <!-- Action Buttons based on File Type -->
            <div class="mt-5 relative z-10">
                <!-- If it's an interactive HTML game/activity -->
                <a th:if="${#strings.equalsIgnoreCase(material.fileType, 'HTML')}"
                   th:href="${material.filePath}" target="_blank"
                   class="block w-full text-center bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold py-2 px-4 rounded-lg transition shadow-sm text-xs md:text-sm">
                    🎮 تشغيل النشاط التفاعلي
                </a>

                <!-- Standard Files -->
                <a th:unless="${#strings.equalsIgnoreCase(material.fileType, 'HTML')}"
                   th:href="${material.filePath}" target="_blank"
                   class="block w-full text-center bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-bold py-2 px-4 rounded-lg transition shadow-sm text-xs md:text-sm">
                    فتح / تحميل الملف
                </a>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-[#1C1917] border-t border-amber-500/20 py-3 text-center text-[#F5EBE6]/50 text-xs">
    &copy; 2026 منصة الجوهرة للمراجع المدرسية. لا يتطلب تسجيل دخول للطلبة.
</footer>

</body>
</html>
