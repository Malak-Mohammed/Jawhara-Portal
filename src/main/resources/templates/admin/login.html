<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - School Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans">
<div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-200">
    <h2 class="text-2xl font-extrabold text-slate-800 text-center mb-6">🔒 Admin Portal Login</h2>

    <form th:action="@{/admin/login}" method="post" class="space-y-4">
        <div>
            <label class="block text-slate-600 font-medium text-sm mb-1">Username</label>
            <input type="text" name="username" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-slate-600 font-medium text-sm mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition">Login</button>
    </form>
    <div class="text-center mt-4">
        <a href="/" class="text-xs text-indigo-600 hover:underline">← Back to Student Portal</a>
    </div>
</div>
</body>
</html>
