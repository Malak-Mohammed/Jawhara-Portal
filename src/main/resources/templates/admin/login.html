<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول المشرف - منصة الجوهرة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#141210] text-[#FDFBF7] flex items-center justify-center min-h-screen font-sans selection:bg-amber-400 selection:text-zinc-950">
<div class="bg-[#1C1917]/90 backdrop-blur-sm p-8 rounded-2xl shadow-xl w-full max-w-md border border-amber-500/20 relative overflow-hidden">
    <!-- Subtle Gold Glow Effect -->
    <div class="absolute inset-0 bg-gradient-to-b from-amber-500/5 to-transparent pointer-events-none"></div>

    <h2 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-500 text-center mb-6">
        🔒 تسجيل دخول المشرفين
    </h2>

    <form th:action="@{/admin/login}" method="post" class="space-y-4">
        <div>
            <label class="block text-amber-200/80 font-medium text-xs mb-1">اسم المستخدم</label>
            <input type="text" name="username" required class="w-full px-4 py-2 bg-slate-900/60 border border-amber-500/30 rounded-xl text-sm text-[#FDFBF7] focus:border-amber-400 outline-none transition">
        </div>
        <div>
            <label class="block text-amber-200/80 font-medium text-xs mb-1">كلمة المرور</label>
            <input type="password" name="password" required class="w-full px-4 py-2 bg-slate-900/60 border border-amber-500/30 rounded-xl text-sm text-[#FDFBF7] focus:border-amber-400 outline-none transition">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-bold py-2.5 rounded-xl transition shadow-sm text-sm">تسجيل الدخول</button>
    </form>

    <div class="text-center mt-5">
        <a href="/" class="text-xs text-amber-400 hover:text-amber-300 transition underline decoration-amber-500/30">← العودة إلى بوابة الطلاب العامة</a>
    </div>
</div>
</body>
</html>
