<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
<header class="bg-slate-900 text-white py-4 px-8 flex justify-between items-center shadow">
    <h1 class="text-xl font-bold">🛠️ Admin Control Panel</h1>
    <div class="flex items-center space-x-4">
        <a href="/" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition">View Public Site</a>
        <form th:action="@{/admin/logout}" method="post" class="inline">
            <button type="submit" class="text-sm bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg transition">Logout</button>
        </form>
    </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-10 grid grid-cols-1 md:grid-cols-2 gap-8">

    <!-- Add Grade Form -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Add New Grade</h3>
        <form th:action="@{/admin/grades/add}" method="post" class="space-y-4">
            <input type="text" name="name" placeholder="Grade Name (e.g. Grade 5)" required class="w-full px-4 py-2 border rounded-xl">
            <input type="number" name="orderIndex" placeholder="Order Index (e.g. 1)" required class="w-full px-4 py-2 border rounded-xl">
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl font-medium">Add Grade</button>
        </form>
    </div>

    <!-- Add Subject Form -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Add New Subject</h3>
        <form th:action="@{/admin/subjects/add}" method="post" class="space-y-4">
            <input type="text" name="name" placeholder="Subject Name (e.g. Mathematics)" required class="w-full px-4 py-2 border rounded-xl">
            <select name="gradeId" required class="w-full px-4 py-2 border rounded-xl bg-white">
                <option value="">Select Grade</option>
                <option th:each="grade : ${grades}" th:value="${grade.id}" th:text="${grade.name}"></option>
            </select>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl font-medium">Add Subject</button>
        </form>
    </div>

    <!-- Add Lesson Form -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Add New Lesson</h3>
        <form th:action="@{/admin/lessons/add}" method="post" class="space-y-4">
            <input type="text" name="title" placeholder="Lesson Title (e.g. Chapter 1)" required class="w-full px-4 py-2 border rounded-xl">
            <input type="number" name="orderIndex" placeholder="Lesson Order (e.g. 1)" required class="w-full px-4 py-2 border rounded-xl">
            <select name="subjectId" required class="w-full px-4 py-2 border rounded-xl bg-white">
                <option value="">Select Subject</option>
                <option th:each="subject : ${subjects}" th:value="${subject.id}" th:text="${subject.name} + ' (' + ${subject.grade.name} + ')'"></option>
            </select>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl font-medium">Add Lesson</button>
        </form>
    </div>

    <!-- Add Material Form -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Upload Study Material</h3>
        <form th:action="@{/admin/materials/add}" method="post" enctype="multipart/form-data" class="space-y-4">
            <input type="text" name="title" placeholder="Material Title (e.g. Lecture Slides)" required class="w-full px-4 py-2 border rounded-xl">
            <select name="fileType" required class="w-full px-4 py-2 border rounded-xl bg-white">
                <option value="pdf">PDF Document</option>
                <option value="pptx">PowerPoint Presentation</option>
                <option value="video">Video</option>
                <option value="image">Image</option>
            </select>
            <select name="lessonId" required class="w-full px-4 py-2 border rounded-xl bg-white">
                <option value="">Select Lesson</option>
                <option th:each="lesson : ${lessons}" th:value="${lesson.id}" th:text="${lesson.title} + ' [' + ${lesson.subject.name} + ']'"></option>
            </select>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Choose File (PDF, PPTX, Video, Image)</label>
                <input type="file" name="file" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl font-medium">Upload File</button>
        </form>
    </div>

</main>
</body>
</html>
